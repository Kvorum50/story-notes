name: build-apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: |
          ls -la
          flutter create --org com.storynotes --project-name story_notes app
          cd app
          flutter pub add shared_preferences http image_picker
          cp "$(ls ../*.dart | head -1)" lib/main.dart
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="story_notes"/android:label="StoryNotes"/' android/app/src/main/AndroidManifest.xml
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: StoryNotes-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
